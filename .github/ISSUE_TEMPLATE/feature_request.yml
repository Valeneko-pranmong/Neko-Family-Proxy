name: Feature Request
description: Propose a new feature, enhancement, or architectural improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Neko Family Proxy!
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area does this feature proposal relate to?
      options:
        - Launcher UI / User Experience
        - Runtime Config Management
        - Integration / Platform Support
        - Developer Tooling & Diagnostics
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Context
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any mockups, diagrams, or additional context.
    validations:
      required: false
