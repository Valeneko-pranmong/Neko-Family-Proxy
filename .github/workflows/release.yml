name: Windows release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the candidate artifact as a GitHub release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing v* tag to publish (required when publishing)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: launcher/pyproject.toml
      - name: Validate repository inputs
        run: python scripts/check_repository_safety.py
      - name: Install launcher build tools
        working-directory: launcher
        run: python -m pip install -e ".[dev,release]"
      - name: Test launcher
        working-directory: launcher
        run: |
          python -m ruff check src tests
          python -m pytest -q -m "not integration"
      - name: Build launcher executables
        working-directory: launcher
        run: |
          python -m PyInstaller --clean --noconfirm NekoLauncher.spec
          python -m PyInstaller --clean --noconfirm NekoUpdater.spec
      - name: Smoke-test updater executable
        working-directory: launcher
        run: dist\NekoUpdater.exe --self-check
      - name: Note closed-beta installer owner gate
        run: echo "Closed-beta installer assembly uses installer/scripts/build_beta_installer.py after approved external Core and prerequisite payloads are staged at Owner Gate."
      - name: Assemble checksummed artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item launcher\dist\NekoLauncher.exe release\
          Copy-Item launcher\dist\NekoUpdater.exe release\
          Get-ChildItem release\*.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
            } |
            Set-Content release\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: neko-family-launcher-windows
          path: release/*
          if-no-files-found: error

  publish-release:
    needs: build-installer
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $mismatch = "Release tag does not match this workflow run."
          if ($env:RELEASE_TAG -notmatch '^v.+$') {
            throw $mismatch
          }

          try {
            $target = gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" 2>$null |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw $mismatch
            }
            $targetType = $target.object.type
            $targetSha = $target.object.sha

            if ($targetType -eq 'tag') {
              $target = gh api "repos/$env:GH_REPO/git/tags/$targetSha" 2>$null |
                ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) {
                throw $mismatch
              }
              $targetType = $target.object.type
              $targetSha = $target.object.sha
            }

            if ($targetType -ne 'commit' -or $targetSha -ne '${{ github.sha }}') {
              throw $mismatch
            }
          }
          catch {
            throw $mismatch
          }
      - name: Download candidate artifact
        uses: actions/download-artifact@v7
        with:
          name: neko-family-launcher-windows
          path: release
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create "$env:RELEASE_TAG" release\NekoLauncher.exe release\NekoUpdater.exe release\SHA256SUMS.txt --verify-tag --generate-notes
