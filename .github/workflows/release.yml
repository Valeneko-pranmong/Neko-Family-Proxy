name: Windows release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Authorize publication of the verified draft release
        required: true
        type: boolean
        default: false
      release_id:
        description: Immutable numeric GitHub draft release ID
        required: true
        type: string
      release_tag:
        description: Expected release Git tag (strictly v5.1.4 for stable release)
        required: true
        type: string
      expected_target:
        description: Expected 40-character commit SHA of target_commitish
        required: true
        type: string
      rollout_release:
        description: Authorize rollout of the staged prerelease to stable
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-installer:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: launcher/pyproject.toml
      - name: Validate repository inputs
        run: python scripts/check_repository_safety.py
      - name: Install launcher build tools
        working-directory: launcher
        run: python -m pip install -e ".[dev,release]"
      - name: Test launcher
        working-directory: launcher
        run: |
          python -m ruff check src tests
          python -m pytest -q -m "not integration"
      - name: Build launcher executables
        working-directory: launcher
        run: |
          python -m PyInstaller --clean --noconfirm NekoLauncher.spec
          python -m PyInstaller --clean --noconfirm NekoUpdater.spec
      - name: Smoke-test updater executable
        working-directory: launcher
        run: dist\NekoUpdater.exe --self-check
      - name: Note closed-beta installer owner gate
        run: echo "Closed-beta installer assembly uses installer/scripts/build_beta_installer.py after approved external Core and prerequisite payloads are staged at Owner Gate."
      - name: Assemble candidate release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item launcher\dist\NekoLauncher.exe release\
          Copy-Item launcher\dist\NekoUpdater.exe release\
      - uses: actions/upload-artifact@v7
        with:
          name: neko-family-launcher-windows
          path: release/*
          if-no-files-found: error

  staged-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: launcher/pyproject.toml
      - name: Install release verifier runtime
        run: python -m pip install -e ".\launcher[release]"
      - name: Validate transitional publication authority inputs locally
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_TARGET: ${{ inputs.expected_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_REPO -cne 'Valeneko-pranmong/Neko-Family-Proxy') {
            throw "Publication is restricted to the canonical repository."
          }
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the checked-out commit SHA."
          }
          if ($checkedOutSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Checked-out commit SHA must be a 40-character hexadecimal value."
          }
          if ($env:RELEASE_ID -notmatch '^[0-9]+$' -or [decimal]$env:RELEASE_ID -le 0) {
            throw "Release ID must be a positive numeric value."
          }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$' -or
              $env:RELEASE_TAG -cne 'v5.1.4') {
            throw "Release tag is invalid for this release."
          }
          if ($env:EXPECTED_TARGET -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Expected target must be a 40-character hexadecimal commit SHA."
          }
          if ($env:EXPECTED_TARGET.ToLowerInvariant() -cne $checkedOutSha.ToLowerInvariant()) {
            throw "Expected target does not match the checked-out commit SHA."
          }
          Write-Host "Authority inputs are locally valid."
      - name: Fetch staged draft and download required assets by immutable IDs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_TARGET: ${{ inputs.expected_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release/metadata, release/remote-verification -Force | Out-Null
          $releaseJson = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch staged draft release by ID." }
          $release = $releaseJson | ConvertFrom-Json
          if ([string]$release.id -ne [string]$env:RELEASE_ID) { throw "Release ID mismatch." }
          if ($release.draft -ne $false) { throw "Release must not be a draft." }
          if ($release.prerelease -ne $true) { throw "Release must be a prerelease." }
          if ($release.tag_name -cne $env:RELEASE_TAG) { throw "Release tag mismatch." }
          if ($release.target_commitish.ToLowerInvariant() -ne $env:EXPECTED_TARGET.ToLowerInvariant()) { throw "Release target mismatch." }
          [System.IO.File]::WriteAllText("release/metadata/draft-release.json", $releaseJson, [System.Text.UTF8Encoding]::new($false))

          $requiredAssetNames = @('NekoFamilyProxy-Setup.exe', 'NekoLauncher.exe', 'NekoUpdater.exe', 'NekoProxyCore.zip', 'release-v2.json')
          $initialAssetBindings = @{}
          foreach ($requiredName in $requiredAssetNames) {
            $matches = @($release.assets | Where-Object { $_.name -ceq $requiredName })
            if ($matches.Count -ne 1) { throw "Required asset must occur exactly once: $requiredName" }
            $assetId = [long]$matches[0].id
            if ($assetId -le 0) { throw "Required asset has an invalid ID: $requiredName" }
            $initialAssetBindings[$requiredName] = $assetId

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = 'gh'
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            [void]$startInfo.ArgumentList.Add('api')
            [void]$startInfo.ArgumentList.Add("repos/$env:GH_REPO/releases/assets/$assetId")
            [void]$startInfo.ArgumentList.Add('-H')
            [void]$startInfo.ArgumentList.Add("Accept: application/octet-stream")
            $process = [System.Diagnostics.Process]::new()
            try {
              $process.StartInfo = $startInfo
              if (-not $process.Start()) { throw "Unable to start asset download: $requiredName" }
              $stderrTask = $process.StandardError.ReadToEndAsync()
              $outputStream = [System.IO.File]::Create("release/remote-verification/$requiredName")
              try { $process.StandardOutput.BaseStream.CopyTo($outputStream) } finally { $outputStream.Dispose() }
              $process.WaitForExit()
              $errorText = $stderrTask.GetAwaiter().GetResult()
              if ($process.ExitCode -ne 0) { throw "Asset download failed for $requiredName`: $errorText" }
              if ((Get-Item "release/remote-verification/$requiredName").Length -le 0) { throw "Downloaded asset is empty: $requiredName" }
            } finally {
              $process.Dispose()
            }
          }
          $initialAssetBindings | ConvertTo-Json | Set-Content release/metadata/initial-asset-bindings.json -Encoding utf8
      - name: Verify staged assets and signed envelope authority
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_TARGET: ${{ inputs.expected_target }}
        run: |
          python scripts/verify_github_release_assets.py `
            --release-json release/metadata/draft-release.json `
            --download-dir release/remote-verification `
            --expected-tag "$env:RELEASE_TAG" `
            --expected-target "$env:EXPECTED_TARGET" `
            --require-prerelease `
            --no-enforce-first-release
      - name: Verify negative resolution for latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and [string]$latest.id -eq [string]$env:RELEASE_ID) {
            throw "Latest release unexpectedly resolved to staged prerelease ID."
          }
          Write-Host "Confirmed latest release does not resolve to staged numeric ID yet."
      - name: Acknowledge Hosted Verification
        run: echo "HOSTED_VERIFIED_READY_FOR_ROLLOUT"

  rollout-stable:
    if: github.event_name == 'workflow_dispatch' && inputs.rollout_release == true
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Fetch and verify immutable prerelease for rollout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_TARGET: ${{ inputs.expected_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_REPO -cne 'Valeneko-pranmong/Neko-Family-Proxy') { throw "Rollout is restricted to the canonical repository." }
          if ($env:RELEASE_ID -notmatch '^[0-9]+$' -or [decimal]$env:RELEASE_ID -le 0) { throw "Release ID must be a positive numeric value." }
          $releaseJson = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch staged release by ID." }
          $release = $releaseJson | ConvertFrom-Json
          if ([string]$release.id -ne [string]$env:RELEASE_ID) { throw "Release ID mismatch." }
          if ($release.draft -ne $false) { throw "Release must not be a draft." }
          if ($release.prerelease -ne $true) { throw "Release must be a prerelease." }
          if ($release.tag_name -cne $env:RELEASE_TAG) { throw "Release tag mismatch." }
          if ($release.target_commitish.ToLowerInvariant() -ne $env:EXPECTED_TARGET.ToLowerInvariant()) { throw "Release target mismatch." }

          # Capture asset sizes/IDs to prevent drift
          $requiredAssetNames = @('NekoFamilyProxy-Setup.exe', 'NekoLauncher.exe', 'NekoUpdater.exe', 'NekoProxyCore.zip', 'release-v2.json')
          $preRolloutAssets = @{}
          foreach ($requiredName in $requiredAssetNames) {
            $matches = @($release.assets | Where-Object { $_.name -ceq $requiredName })
            if ($matches.Count -ne 1) { throw "Required asset must occur exactly once: $requiredName" }
            $preRolloutAssets[$requiredName] = @{
              id = [long]$matches[0].id
              size = [long]$matches[0].size
            }
          }
          $preRolloutAssets | ConvertTo-Json | Set-Content pre-rollout-assets.json -Encoding utf8

      - name: Promote prerelease to stable rollout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID" --method PATCH -F prerelease=false -f make_latest=true
          if ($LASTEXITCODE -ne 0) { throw "Unable to promote release to stable." }
          Write-Host "Rollout metadata promotion complete."

      - name: Verify post-rollout immutability and exact assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch promoted release by ID." }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.draft -ne $false) { throw "Release must not be a draft after rollout." }
          if ($release.prerelease -ne $false) { throw "Release must not be a prerelease after rollout." }

          $preRolloutAssets = Get-Content pre-rollout-assets.json -Raw | ConvertFrom-Json
          foreach ($prop in $preRolloutAssets.psobject.properties) {
            $name = $prop.Name
            $expectedId = $prop.Value.id
            $expectedSize = $prop.Value.size
            $matches = @($release.assets | Where-Object { $_.name -ceq $name })
            if ($matches.Count -ne 1) { throw "Post-rollout missing asset: $name" }
            if ([long]$matches[0].id -ne $expectedId) { throw "Post-rollout asset ID drift for $name" }
            if ([long]$matches[0].size -ne $expectedSize) { throw "Post-rollout asset size drift for $name" }
          }
          Write-Host "Post-rollout exact asset verification passed."

      - name: Gate3 Latest Resolver Validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 10
          $attempt = 1
          $resolved = $false
          while ($attempt -le $maxAttempts) {
            Write-Host "Attempt $attempt of $maxAttempts: Resolving /releases/latest"
            $latestJson = gh api "repos/$env:GH_REPO/releases/latest"
            if ($LASTEXITCODE -eq 0) {
              $latest = $latestJson | ConvertFrom-Json
              if ([string]$latest.id -eq [string]$env:RELEASE_ID -and $latest.tag_name -ceq $env:RELEASE_TAG) {
                $resolved = $true
                break
              }
            }
            Start-Sleep -Seconds 5
            $attempt++
          }
          if (-not $resolved) { throw "Gate3 timeout: /releases/latest did not resolve to rollout ID $env:RELEASE_ID and tag $env:RELEASE_TAG" }

          # Final gate3 asset check
          $preRolloutAssets = Get-Content pre-rollout-assets.json -Raw | ConvertFrom-Json
          foreach ($prop in $preRolloutAssets.psobject.properties) {
            $name = $prop.Name
            $expectedSize = $prop.Value.size
            $matches = @($latest.assets | Where-Object { $_.name -ceq $name })
            if ($matches.Count -ne 1) { throw "Gate3 missing asset: $name" }
            if ([long]$matches[0].size -ne $expectedSize) { throw "Gate3 asset size drift for $name" }
          }
          Write-Host "Gate3 rollout accepted."
