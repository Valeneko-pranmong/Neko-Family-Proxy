# Local Supabase Auth configuration for username/password registration.
# Hosted projects must use the Auth Providers page to turn off "Confirm email".

[auth]
enable_signup = true

[auth.email]
enable_confirmations = false

[functions.issue_launch_permit]
# Gateway verification is defense in depth; the function also validates the
# access token with Supabase Auth before resolving authorization state.
verify_jwt = true

[functions.launcher_bridge]
# The identity token is a custom RS256 bearer, not a Supabase JWT. The function
# validates it against the identity JWKS before creating a Supabase session.
verify_jwt = false
